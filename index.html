<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LongwayStar的个人网站" />
    <meta name="author" content="LongwayStar的个人主页" />
    <link rel="icon" href="lib/icons/new_title.ico" />
    <link rel="stylesheet" href="lib/css/generalstyle.css" />
    <title>LongWeb-Home</title>
    <style>
        .card h2 {
            margin-bottom: 0.75rem;
        }
        .card .avatar {
            display: block;
            margin: 0.5rem auto 0.2rem;
            border-radius: 50%;
            border: 3px solid var(--cyan-200);
            transition: border-color 0.3s ease, transform 0.3s ease;
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .card .avatar:hover {
            transform: scale(1.02);
            border-color: var(--cyan-500);
        }
        .card cite {
            display: block;
            font-style: normal;
            font-size: 1.1rem;
            font-weight: 450;
            color: var(--text-secondary);
            margin: 0.3rem 0 0.6rem;
        }
        .card .link-btn {
            margin-top: 0.2rem;
        }
        .link-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
            margin-top: 0.5rem;
        }
        .link-group a {
            color: var(--cyan-500);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            background: var(--cyan-50);
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        [data-theme="dark"] .link-group a {
            background: rgba(103, 232, 249, 0.12);
            color: var(--cyan-300);
        }
        .link-group a:hover {
            background: var(--cyan-200);
            color: #0a1a22;
            border-color: var(--cyan-500);
        }
        [data-theme="dark"] .link-group a:hover {
            background: var(--cyan-300);
            color: #0a1a22;
        }
        @media (max-width: 600px) {
            .card .avatar {
                width: 80px;
                height: 80px;
            }
            .link-group {
                gap: 0.8rem;
            }
            .card .link-btn {
                padding: 0.4rem 1.4rem;
                font-size: 0.9rem;
            }
        }
        @media (max-width: 400px) {
            .card .avatar {
                width: 68px;
                height: 68px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换暗色/亮色模式">
        <span class="icon" id="themeIcon">🌙</span>
        <span id="themeLabel">暗色</span>
    </button>
    <div class="container">
        <header class="header">
            <h1>欢迎访问 LongwWeb!</h1>
            <hr />
        </header>
        <section class="card">
            <h2>关于 Github</h2>
            <img
                class="avatar"
                src="https://avatars.githubusercontent.com/u/88468680?v=4&size=64"
                alt="my Github avatar"
                width="100"
                height="100"
            />
            <cite>LongwayStar</cite>
            <br />
            <a class="link-btn" href="https://github.com/LongwayStar" target="_blank">我的Github账号</a>
        </section>
        <section class="card">
            <h2>关于 B站</h2>
            <img
                class="avatar"
                src="https://i2.hdslb.com/bfs/face/4df4d3a1075896637097d6edf3d69d9ab20aace7.jpg@128w_128h_1c_1s.webp"
                alt="my bilibili avatar"
                width="100"
                height="100"
            />
            <cite>LongwayStar</cite>
            <br />
            <a class="link-btn" href="https://space.bilibili.com/673847297" target="_blank">我的Bilibili账号</a>
        </section>
        <section class="card">
            <h2>关于其他主页</h2>
            <div class="link-group">
                <a href="newlook/index.html">新主页(测试中)</a>
                <a href="historylist/index.html">历史版本列表</a>
            </div>
        </section>
    </div>
    <footer class="footer">
        <div class="footer-content">
            <p>Powered by GithubPages</p>
            <p>Coded by Deepseek</p>
            <p>Created by LongwayStar</p>
        </div>
    </footer>
    <script>
        (function() {
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            const html = document.documentElement;
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme) {
                html.setAttribute('data-theme', storedTheme);
                updateButton(storedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
                updateButton('dark');
            } else {
                html.setAttribute('data-theme', 'light');
                updateButton('light');
            }
            function updateButton(theme) {
                if (theme === 'dark') {
                    icon.textContent = '☀️';
                    label.textContent = '亮色';
                } else {
                    icon.textContent = '🌙';
                    label.textContent = '暗色';
                }
            }
            toggleBtn.addEventListener('click', function() {
                const current = html.getAttribute('data-theme');
                const next = (current === 'dark') ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateButton(next);
            });
            const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMedia.addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    const newTheme = e.matches ? 'dark' : 'light';
                    html.setAttribute('data-theme', newTheme);
                    updateButton(newTheme);
                }
            });
        })();
    </script>
</body>
</html>
