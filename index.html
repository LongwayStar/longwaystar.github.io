<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LongwayStar的个人网站" />
    <meta name="author" content="LongwayStar的个人主页" />
    <link rel="icon" href="lib/icons/new_title.ico" />
    <link rel="stylesheet" href="lib/css/generalstyle.css" />
    <link rel="stylesheet" href="lib/css/blog.css" />
    <title>LongWeb</title>
</head>
<body>
    <div class="layout" id="layout">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="收起或展开侧边栏" title="收起/展开"></button>
        <!-- 左侧边栏 -->
        <aside class="sidebar" aria-label="主导航">
            <div class="tabs" role="tablist">
                <button class="tab active" id="tabBtn-home" role="tab" aria-selected="true" data-tab="home">主页</button>
                <button class="tab" id="tabBtn-blog" role="tab" aria-selected="false" data-tab="blog">我的博客</button>
                <button class="tab" id="tabBtn-empty" role="tab" aria-selected="false" data-tab="empty">空白页面</button>
                <button class="tab" id="tabBtn-history" role="tab" aria-selected="false" data-tab="history">历史版本</button>
                <button class="tab" id="tabBtn-settings" role="tab" aria-selected="false" data-tab="settings">设置与相关</button>
            </div>
            <button class="refresh-bg" id="refreshBg" aria-label="刷新背景" title="刷新背景">
                <span class="icon" id="refreshIcon">🔄</span>
                <span id="refreshLabel">刷新背景</span>
            </button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换暗色/亮色模式">
                <span class="icon" id="themeIcon">🌙</span>
                <span id="themeLabel">暗色</span>
            </button>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main">
            <div class="container">
                <!-- 主页面板 -->
                <section id="tab-home" class="tab-panel active" role="tabpanel" aria-labelledby="tabBtn-home">
                    <header class="header">
                        <h1>欢迎访问 LongWeb!</h1>
                        <hr />
                    </header>
                    <section class="card">
                        <h2>关于Github</h2>
                        <img
                            class="avatar"
                            src="https://avatars.githubusercontent.com/u/88468680?v=4&size=128"
                            alt="my Github avatar"
                            width="100"
                            height="100"
                        />
                        <cite>LongwayStar</cite>
                        <br />
                        <a class="link-btn" href="https://github.com/LongwayStar" target="_blank">我的Github账号</a>
                    </section>
                    <section class="card">
                        <h2>关于B站</h2>
                        <img
                            class="avatar"
                            src="https://i2.hdslb.com/bfs/face/4df4d3a1075896637097d6edf3d69d9ab20aace7.jpg@128w_128h_1c_1s.webp"
                            alt="my bilibili avatar"
                            width="100"
                            height="100"
                        />
                        <cite>LongwayStar</cite>
                        <br />
                        <a class="link-btn" href="https://space.bilibili.com/673847297" target="_blank">我的Bilibili账号</a>
                    </section>
                    <section class="card">
                        <h2>关于其他页面</h2>
                        <div class="link-group">
                            <a href="newlook/index.html">新主页(测试中)</a>
                            <a href="testground/index.html" target="_blank">测试区</a>
                        </div>
                    </section>
                </section>

                <!-- 我的博客面板 -->
                <section id="tab-blog" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-blog">
                    <!-- ① 标题部分（页眉式） -->
                    <header class="blog-header">
                        <h1>我的博客</h1>
                        <span class="blog-stat" id="blogStat">本站已有 <strong>0</strong> 篇文章</span>
                    </header>

                    <div class="blog-layout">
                        <!-- ② 文章浏览区 -->
                        <div class="blog-browse" id="blogBrowse">
                            <!-- 列表态 -->
                            <div id="blogListView">
                                <div id="blogCardList" class="blog-list">
                                    <div class="blog-loading" id="blogLoading">正在加载...</div>
                                </div>
                            </div>
                            <!-- 阅读态 -->
                            <div class="blog-read-view" id="blogReadView">
                                <button class="blog-back" id="blogBack" title="返回列表" aria-label="返回列表">
                                    <img src="lib/icons/back.ico" alt="返回" />
                                </button>
                                <h2 class="blog-read-title" id="blogReadTitle"></h2>
                                <div class="blog-read-meta" id="blogReadMeta"></div>
                                <div class="blog-read-content" id="blogReadContent"></div>
                            </div>
                        </div>

                        <!-- ③ 文章筛选区 -->
                        <aside class="blog-filter" id="blogFilterPanel">
                            <h3>筛选与排序</h3>
                            <label class="blog-filter-label" for="blogSearchName">按名称搜索（模糊）</label>
                            <input type="search" id="blogSearchName" placeholder="输入文章名称..." aria-label="按名称搜索文章" />
                            <label class="blog-filter-label" for="blogSearchTheme">按主题筛选（精确）</label>
                            <input type="text" id="blogSearchTheme" placeholder="输入主题，如：技术" aria-label="按主题筛选文章" />
                            <div class="blog-sort-group">
                                <div class="blog-sort-row">
                                    <button class="blog-sort-btn" id="blogSortName">按名称</button>
                                    <button class="blog-sort-btn" id="blogSortTime">按时间</button>
                                </div>
                                <div class="blog-sort-row">
                                    <button class="blog-sort-btn" id="blogSortDir" disabled>升序 ↑</button>
                                    <button class="blog-sort-btn" id="blogSortReset">取消</button>
                                </div>
                            </div>
                        </aside>
                    </div>

                    <!-- ④ 页面选择区 -->
                    <nav class="blog-pager" id="blogPager" aria-label="分页"></nav>
                </section>

                <!-- 空白页面面板 -->
                <section id="tab-empty" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-empty">
                </section>

                <!-- 历史版本面板 -->
                <section id="tab-history" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-history">
                    <header class="header">
                        <h1>历史版本列表</h1>
                        <hr />
                    </header>
                    <section class="card" id="releaseCard">
                        <h2>Release 版本</h2>
                        <div id="releaseContent"><div class="loading">加载中...</div></div>
                    </section>
                    <section class="card" id="betaCard">
                        <h2>Beta 版本</h2>
                        <div id="betaContent"><div class="loading">加载中...</div></div>
                    </section>
                </section>

                <!-- 设置与相关面板 -->
                <section id="tab-settings" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-settings">
                    <header class="header">
                        <h1>设置与相关</h1>
                        <hr />
                    </header>
                    <section class="card">
                        <h2>关于壁纸</h2>
                        <div class="bg-actions">
                            <button class="link-btn" id="settingsRefreshBg" type="button">刷新背景</button>
                        </div>
                    </section>
                    <section class="card">
                        <h2>致谢名单</h2>
                        <div id="thanksContent"><div class="loading">加载中...</div></div>
                    </section>
                </section>
            </div>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p>Powered by GithubPages</p>
            <p>Coded by Deepseek&LongwayStar</p>
            <p>Created by LongwayStar in 2026</p>
        </div>
    </footer>
    <script>
        (function() {
            /* ===== 模块状态（提前声明，避免 TDZ：刷新直达历史/设置页时立即加载） ===== */
            let historyLoaded = false;
            let thanksLoaded = false;

            /* ===== 侧边栏收起 / 展开 ===== */
            const layout = document.getElementById('layout');
            const sidebarToggle = document.getElementById('sidebarToggle');
            function toggleSidebar() {
                const collapsed = layout.classList.toggle('collapsed');
                sidebarToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                sidebarToggle.title = collapsed ? '展开侧边栏' : '收起侧边栏';
            }
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', toggleSidebar);
            }

            /* ===== 主题切换 ===== */
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            const html = document.documentElement;
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme) {
                html.setAttribute('data-theme', storedTheme);
                updateButton(storedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
                updateButton('dark');
            } else {
                html.setAttribute('data-theme', 'light');
                updateButton('light');
            }
            function updateButton(theme) {
                if (theme === 'dark') {
                    icon.textContent = '☀️';
                    label.textContent = '浅色模式';
                } else {
                    icon.textContent = '🌙';
                    label.textContent = '深色模式';
                }
            }
            toggleBtn.addEventListener('click', function() {
                const current = html.getAttribute('data-theme');
                const next = (current === 'dark') ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateButton(next);
            });
            const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMedia.addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    const newTheme = e.matches ? 'dark' : 'light';
                    html.setAttribute('data-theme', newTheme);
                    updateButton(newTheme);
                }
            });

            /* ===== 刷新 / 下载背景 ===== */
            const body = document.body;
            let currentBgUrl = '';    // 当前背景的最终稳定 URL（经重定向后的真实图片地址）

            function backgroundUrl() {
                return 'https://t.alcy.cc/ycy?t=' + Date.now();
            }
            // 刷新背景：img 加载（跨域无需 CORS），加载后读取 currentSrc 得到最终稳定 URL
            function refreshBackground() {
                const newUrl = backgroundUrl();
                const img = new Image();
                img.onload = function() {
                    // currentSrc 为重定向后的真实图片地址（稳定静态文件，与屏幕显示一致）
                    currentBgUrl = img.currentSrc || newUrl;
                    body.style.backgroundImage = 'url("' + currentBgUrl + '")';
                };
                img.onerror = function() {
                    // 加载失败也设置背景（可能服务暂时无响应，但至少更新 URL）
                    body.style.backgroundImage = 'url("' + newUrl + '")';
                };
                img.src = newUrl;
            }
            // 下载背景功能已移除（跨域限制下无法可靠下载当前背景）
            const refreshBgBtn = document.getElementById('refreshBg');
            refreshBgBtn.addEventListener('click', refreshBackground);
            const settingsRefreshBtn = document.getElementById('settingsRefreshBg');
            if (settingsRefreshBtn) settingsRefreshBtn.addEventListener('click', refreshBackground);

            // 页面加载后：若从未刷新过，主动刷新一次以记录当前背景的稳定 URL
            (function initBackground() {
                if (!currentBgUrl) refreshBackground();
            })();

            /* ===== 侧边栏标签切换（hash 驱动） ===== */
            const tabs = document.querySelectorAll('.tab');
            const panels = document.querySelectorAll('.tab-panel');

            function showTab(name) {
                let active = false;
                tabs.forEach(function(t) {
                    const isActive = (t.dataset.tab === name);
                    t.classList.toggle('active', isActive);
                    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    if (isActive) active = true;
                });
                panels.forEach(function(p) {
                    const isActive = (p.id === 'tab-' + name);
                    p.classList.toggle('active', isActive);
                });
                if (!active) name = 'home';
                if (history.replaceState) {
                    history.replaceState(null, '', '#' + name);
                }
                if (name === 'blog' && window.BlogModule) {
                    window.BlogModule.ensureLoaded();
                }
                if (name === 'history') loadHistory();
                if (name === 'settings') loadThanks();
            }

            tabs.forEach(function(t) {
                t.addEventListener('click', function() {
                    showTab(t.dataset.tab);
                });
            });

            // 初始：根据 hash 或默认主页
            const initial = ['#home', '#blog', '#empty', '#history', '#settings'].includes(location.hash) ? location.hash.slice(1) : 'home';
            showTab(initial);

            /* ===== 历史版本数据懒加载（首次显示时拉取一次） ===== */
            async function loadVersionList(fileName, containerId) {
                const container = document.getElementById(containerId);
                // 相对于根目录 index.html 的路径
                const baseUrl = 'lib/words/historylist/';
                const encodedFile = encodeURIComponent(fileName);
                const url = baseUrl + encodedFile;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const text = await response.text();
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    if (lines.length === 0) {
                        container.innerHTML = '<div class="error">暂无版本记录</div>';
                        return;
                    }
                    let ul = document.createElement('ul');
                    ul.className = 'version-list';
                    lines.forEach(function(line) {
                        let li = document.createElement('li');
                        li.textContent = line.trim();
                        ul.appendChild(li);
                    });
                    container.innerHTML = '';
                    container.appendChild(ul);
                } catch (error) {
                    container.innerHTML = '<div class="error">加载失败: ' + error.message + '</div>';
                }
            }

            function loadHistory() {
                if (historyLoaded) return;
                historyLoaded = true;
                loadVersionList('BETA版本.txt', 'betaContent');
                loadVersionList('RELEASE版本.txt', 'releaseContent');
            }

            /* ===== 致谢名单懒加载（首次显示时拉取一次） ===== */
            async function loadThanks() {
                if (thanksLoaded) return;
                thanksLoaded = true;
                const container = document.getElementById('thanksContent');
                try {
                    const response = await fetch('lib/words/thanks/致谢名单.txt');
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const text = await response.text();
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    if (lines.length === 0) {
                        container.innerHTML = '<div class="error">暂无致谢名单</div>';
                        return;
                    }
                    let ul = document.createElement('ul');
                    ul.className = 'version-list';
                    lines.forEach(function(line) {
                        let li = document.createElement('li');
                        li.textContent = line.trim();
                        ul.appendChild(li);
                    });
                    container.innerHTML = '';
                    container.appendChild(ul);
                } catch (error) {
                    container.innerHTML = '<div class="error">加载失败: ' + error.message + '</div>';
                }
            }
        })();
    </script>
    <script src="lib/js/blog.js"></script>
</body>
</html>
