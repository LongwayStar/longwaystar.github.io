    <script>
        /* ============================================================
           主题初始化（必须放在 CSS 之前同步执行，避免首屏亮/暗闪烁 FOUC）
           模式三态：
             'auto'  跟随浏览器（系统）主题 —— 默认，也是「恢复跟随」的目标
             'light' / 'dark'  用户手动固定的主题
           本地存储键 theme 只保存手动选择；恢复跟随时删除该键
           ============================================================ */
        (function () {
            var KEY = 'theme';
            var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

            function readMode() {
                try {
                    var v = localStorage.getItem(KEY);
                    if (v === 'light' || v === 'dark') return v;
                } catch (e) { /* 隐私模式 / 存储被禁用：按 auto 处理 */ }
                return 'auto';
            }
            function systemResolved() { return (mq && mq.matches) ? 'dark' : 'light'; }
            function resolve(mode) { return mode === 'auto' ? systemResolved() : mode; }
            function writeMode(mode) {
                try {
                    if (mode === 'auto') localStorage.removeItem(KEY);
                    else localStorage.setItem(KEY, mode);
                } catch (e) { /* 静默失败 */ }
            }

            var mode = readMode();
            // 应用主题：返回最终生效的 'light' / 'dark'
            function apply(nextMode) {
                if (nextMode) mode = nextMode;
                var resolved = resolve(mode);
                var el = document.documentElement;
                el.setAttribute('data-theme', resolved);
                el.setAttribute('data-theme-mode', mode);
                return resolved;
            }
            apply(mode);

            window.AppTheme = {
                getMode: function () { return mode; },
                isAuto: function () { return mode === 'auto'; },
                getResolved: function () { return resolve(mode); },
                // 侧边栏按钮：在 auto 下取当前生效值的反色作为显式选择
                toggle: function () {
                    var next = (resolve(mode) === 'dark') ? 'light' : 'dark';
                    writeMode(next);
                    return apply(next);
                },
                // 「恢复跟随」：回到 auto
                followSystem: function () { writeMode('auto'); return apply('auto'); }
            };

            // 系统主题变化：仅在 auto 模式下实时跟随
            if (mq) {
                var onSystemChange = function () { if (mode === 'auto') apply('auto'); };
                if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
                else if (mq.addListener) mq.addListener(onSystemChange); // 旧内核兜底
            }
        })();
    </script>

    <script>
        (function() {
            /* ===== 模块状态（提前声明，避免 TDZ：刷新直达历史/设置页时立即加载） ===== */
            let thanksLoaded = false;

            /* ===== 侧边栏收起 / 展开（含记忆功能） ===== */
            const layout = document.getElementById('layout');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const SB_KEY = 'sidebarCollapsed';
            // 是否处于桌面侧边栏模式（手机端为顶栏，不应用收起记忆）
            function isDesktopSidebar() {
                return !window.matchMedia || !window.matchMedia('(max-width: 640px)').matches;
            }
            function applySidebarState(collapsed) {
                layout.classList.toggle('collapsed', !!collapsed);
                if (sidebarToggle) {
                    sidebarToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                    sidebarToggle.title = collapsed ? '展开侧边栏' : '收起侧边栏';
                }
            }
            function toggleSidebar() {
                const next = !layout.classList.contains('collapsed');
                applySidebarState(next);
                try {
                    if (next) localStorage.setItem(SB_KEY, '1');
                    else localStorage.removeItem(SB_KEY);
                } catch (e) { /* localStorage 不可用时忽略 */ }
            }
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', toggleSidebar);
            }
            // 初始化：桌面端恢复记忆的收起状态
            (function initSidebarState() {
                if (!isDesktopSidebar()) return;
                let stored = false;
                try { stored = localStorage.getItem(SB_KEY) === '1'; } catch (e) { /* ignore */ }
                if (stored) applySidebarState(true);
            })();

            /* ===== 站内导航（支持浏览器前进 / 后退） =====
               navIdx 记录"当前处在第几层站内历史"，0 表示首屏那一条记录（没有可回退的站内历史）。
               所有会写 URL 的操作都必须走这里，保证 popstate 时能校准层数，
               从而让「返回」按钮既能在站内回退、又绝不会把用户带出站点。 */
            let navIdx = 0;
            function currentHash() { return location.hash || ''; }
            // 新增一条历史（用户主动导航：点标签、点文章卡片）
            function pushNav(hash) {
                if (currentHash() === hash) return false;
                navIdx++;
                history.pushState({ navIdx: navIdx }, '', hash);
                return true;
            }
            // 替换当前记录（初始化、状态修正：不产生可回退项）
            function replaceNav(hash) {
                if (currentHash() === hash) return false;
                history.replaceState({ navIdx: navIdx }, '', hash);
                return true;
            }
            window.AppNav = {
                push: pushNav,
                replace: replaceNav,
                canGoBack: function () { return navIdx > 0; },
                // 站内返回：有站内历史就真的回退（触发 popstate 由各模块重建视图），
                // 否则只把 hash 换成回退目标（直达链接等首屏场景）
                goBack: function (fallbackHash) {
                    if (navIdx > 0) { history.back(); return true; }
                    replaceNav(fallbackHash);
                    return false;
                }
            };
            // 给首屏那条历史记录也打上 state，便于 popstate 校准
            if (history.replaceState) history.replaceState({ navIdx: 0 }, '', location.href);

            /* ===== 主题切换（三态：auto 跟随系统 / light / dark 固定） ===== */
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            const themeStatusEl = document.getElementById('themeStatus');
            const followSystemBtn = document.getElementById('settingsFollowSystem');
            function updateThemeUI() {
                const resolved = window.AppTheme.getResolved();
                const auto = window.AppTheme.isAuto();
                if (resolved === 'dark') {
                    icon.textContent = '☀️';
                    label.textContent = '浅色模式';
                } else {
                    icon.textContent = '🌙';
                    label.textContent = '深色模式';
                }
                toggleBtn.title = auto
                    ? '当前跟随浏览器主题，点击可固定为另一种主题'
                    : '切换亮色 / 暗色主题';
                if (themeStatusEl) {
                    themeStatusEl.textContent = auto
                        ? '当前已跟随浏览器主题'
                        : '当前主题已更改，点击下方按钮恢复自动切换';
                }
            }
            toggleBtn.addEventListener('click', function() {
                window.AppTheme.toggle();
                updateThemeUI();
            });
            if (followSystemBtn) {
                followSystemBtn.addEventListener('click', function() {
                    window.AppTheme.followSystem();
                    updateThemeUI();
                });
            }
            // 系统主题变化时同步界面文案（实际换肤由 AppTheme 内部在 auto 模式下完成）
            (function bindSystemThemeUI() {
                const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
                if (!mq) return;
                const onChange = function() { updateThemeUI(); };
                if (mq.addEventListener) mq.addEventListener('change', onChange);
                else if (mq.addListener) mq.addListener(onChange);
            })();
            updateThemeUI();

            /* ===== 刷新壁纸 / 获取当前壁纸 =====
               api.yppp.net/api.php 是"随机壁纸"入口：**每次请求都会跳到另一张图**
               （跳转链 api.php → 302 pc.php → 302 list.yppp.net/d/image/<hash>）。
               所以绝不能拿它本身当壁纸地址——那样每次渲染背景、每次下载都会
               变成另一张图（这正是更早一版"获取当前壁纸"对不上的根因：
               img.currentSrc 拿到的其实是原始 URL，而不是重定向后的地址）。
               正确做法：先跟随重定向解析出**真实固定链接**，再用真实链接设背景。

               ✅ 线上实测：该 API 整条跳转链都带 Access-Control-Allow-Origin: *
               （连中间那两个 302 都有），所以浏览器端 fetch 能读到字节 ——
               "一键下载"这条主路可行（换掉的老图床 t.alcy.cc 就是缺这个头才失败的）。
               万一将来又遇到不发 CORS 的图床：读不到字节就没法给出与屏幕一致的文件，
               此时只如实提示，绝不给错图。 */
            const WALLPAPER_API = 'https://api.yppp.net/api.php';
            const body = document.body;
            const bgLayer = document.getElementById('bgLayer');
            // 当前壁纸状态：url = 铺在背景图层上的地址；resolved = 该地址是否就是屏幕上那张图；
            // blob = 直接取下来的图片数据（有它就不必再下载一次）
            let currentBg = { url: '', resolved: false, blob: null, blobUrl: '' };
            const layerEl = bgLayer || body;   // 图层缺失时退化为直接铺在 body 上

            function randomWallpaperUrl() {
                return WALLPAPER_API + '?t=' + Date.now();
            }
            // 把壁纸铺到**背景图层**上（用 background-image，不是 <img>：
            // 背景图层不会被选中/拖动，也不会在加载失败时露出破图占位）。
            // 调用前都会先 preloadImage，同一 URL 命中缓存，所以切换时不会白一下。
            function applyWallpaper(url) {
                if (!url) return;
                layerEl.style.backgroundImage = "url('" + String(url).replace(/'/g, '%27') + "')";
            }
            // 预加载（跨域无需 CORS）：让切换背景时不会先白一下
            function preloadImage(url) {
                return new Promise(function(resolve) {
                    const img = new Image();
                    img.onload = function() { resolve(img.currentSrc || url); };
                    img.onerror = function() { resolve(url); };
                    img.src = url;
                });
            }
            // 跟随重定向拿"真实固定链接"。只有确实发生了跳转（final ≠ 请求地址）
            // 才返回它；没跳转说明该地址本身就是随机入口，不可用作壁纸地址。
            // 先用 HEAD（不下载图片本体），不被支持时再用 GET 并在拿到地址后立刻中断
            async function resolveWallpaperRedirect(reqUrl) {
                try {
                    const head = await fetch(reqUrl, { method: 'HEAD', redirect: 'follow', cache: 'no-store' });
                    if (head.ok && head.url && head.url !== reqUrl) return head.url;
                } catch (e) { /* HEAD 不被支持 → 试 GET */ }
                try {
                    const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
                    const res = await fetch(reqUrl, {
                        redirect: 'follow', cache: 'no-store',
                        signal: ctl ? ctl.signal : undefined
                    });
                    const finalUrl = res.url || '';
                    const ok = res.ok;
                    if (ctl) ctl.abort();   // 拿到地址就够了，别把整张图下下来
                    if (ok && finalUrl && finalUrl !== reqUrl) return finalUrl;
                } catch (e) { /* 解析失败 */ }
                return null;
            }

            // 刷新壁纸：① 解析真实链接 → ② 解析不到就取成 blob（也是稳定的同一张）
            // → ③ 都失败才退回"直接用随机入口"（能显示，但脚本读不到字节）
            async function refreshBackground() {
                if (currentBg.blobUrl) {
                    try { URL.revokeObjectURL(currentBg.blobUrl); } catch (e) { /* 忽略 */ }
                }
                currentBg = { url: '', resolved: false, blob: null, blobUrl: '' };

                const reqUrl = randomWallpaperUrl();
                const realUrl = await resolveWallpaperRedirect(reqUrl);
                if (realUrl) {
                    await preloadImage(realUrl);      // 预热，切换时更顺
                    currentBg.url = realUrl;
                    currentBg.resolved = true;
                } else {
                    try {
                        const res = await fetch(reqUrl, { cache: 'no-store' });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const blob = await res.blob();
                        const objUrl = URL.createObjectURL(blob);
                        currentBg = { url: objUrl, resolved: true, blob: blob, blobUrl: objUrl };
                    } catch (e) {
                        // 万一图床没开放跨域（老图床 t.alcy.cc 就是这样）：
                        // 仍用同一个随机地址当背景（同 URL 命中预加载缓存，所以屏幕这张
                        // 就是预加载那张），但脚本读不到它的字节，之后无法保存
                        currentBg.url = await preloadImage(reqUrl);
                        currentBg.resolved = false;
                    }
                }
                applyWallpaper(currentBg.url);
                return currentBg.url;
            }

            // 背景卡片上的状态提示
            const bgStatusEl = document.getElementById('bgStatus');
            function setBgStatus(text) {
                if (bgStatusEl) bgStatusEl.textContent = text || '';
            }
            function pad2(n) { return (n < 10 ? '0' : '') + n; }

            /* 把图片数据转成**真正的 PNG**（canvas 重编码）。
               为什么要真转换：JPEG 的字节不会因为改了后缀就变成 PNG，
               直接改名只会得到一个"名不副实"的文件。
               已经是 PNG 的直接复用；图太大 / 浏览器不支持 canvas 时返回 null，
               由调用方回退到原格式（宁可保持原样，也不给损坏的文件） */
            async function blobToPng(blob) {
                if (!blob) return null;
                if (blob.type === 'image/png') return blob;   // 本来就是 PNG，无需重编码
                const objUrl = URL.createObjectURL(blob);
                try {
                    const img = await new Promise(function(resolve, reject) {
                        const im = new Image();
                        im.onload = function() { resolve(im); };
                        im.onerror = function() { reject(new Error('图片解码失败')); };
                        im.src = objUrl;
                    });
                    const w = img.naturalWidth || img.width;
                    const h = img.naturalHeight || img.height;
                    if (!w || !h) return null;
                    const cv = document.createElement('canvas');
                    cv.width = w;
                    cv.height = h;
                    const ctx = cv.getContext ? cv.getContext('2d') : null;
                    if (!ctx) return null;
                    ctx.drawImage(img, 0, 0);
                    if (!cv.toBlob) return null;
                    const png = await new Promise(function(resolve) {
                        cv.toBlob(function(b) { resolve(b); }, 'image/png');
                    });
                    return png && png.type === 'image/png' ? png : null;
                } catch (e) {
                    return null;   // 超大图 / canvas 不可用 → 交给调用方回退
                } finally {
                    URL.revokeObjectURL(objUrl);
                }
            }

            /* 获取当前壁纸：把屏幕上正在显示的那张图存下来。
               resolved 为真（拿到了字节或真实固定链接）→ 走脚本一键下载；
               读不到字节（图床不发 CORS 头时的兜底，当前 API 不会走到这里）→
               只如实说明，**绝不**给出一张"和屏幕不一样"的图片。
               能下载时保存格式统一为 PNG（转换失败则按原格式保存并说明） */
            async function saveCurrentWallpaper() {
                if (!currentBg.url) {
                    setBgStatus('正在获取壁纸…');
                    await refreshBackground();
                }
                // ---- 拿不到字节：无法保证与屏幕一致，如实说明而不换图 ----
                if (!currentBg.resolved) {
                    setBgStatus('图床未开放跨域读取（浏览器安全策略），无法取出与屏幕一致的原图；点「刷新背景」可再试一次');
                    return;
                }
                const now = new Date();
                const stamp = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' +
                    pad2(now.getDate()) + '-' + pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds());
                try {
                    // 已经取过 blob 就直接用，省一次请求；否则按真实固定链接取
                    let blob = currentBg.blob;
                    if (!blob) {
                        const res = await fetch(currentBg.url, { mode: 'cors', cache: 'no-store' });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        blob = await res.blob();
                    }
                    // 统一转成真正的 PNG；转不了就保留原格式
                    const pngBlob = await blobToPng(blob);
                    let outBlob = pngBlob;
                    let ext = 'png';
                    let note = '';
                    if (!outBlob) {
                        outBlob = blob;
                        const m = String(currentBg.url).split('?')[0].match(/\.(jpe?g|png|webp|gif|avif|bmp)$/i);
                        ext = (blob.type && /^image\//.test(blob.type))
                            ? blob.type.replace('image/', '').replace('jpeg', 'jpg')
                            : (m ? m[1].toLowerCase() : 'jpg');
                        note = '（转 PNG 失败，已按原格式 ' + ext + ' 保存）';
                    }
                    const fileName = 'wallpaper-' + stamp + '.' + ext;
                    const objUrl = URL.createObjectURL(outBlob);
                    const a = document.createElement('a');
                    a.href = objUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(function() { URL.revokeObjectURL(objUrl); }, 10000);
                    setBgStatus('已开始下载：' + fileName + note);
                } catch (err) {
                    // 兜底也失败（理论上少见）：退化为新标签页打开，用户可右键另存
                    const opened = window.open(currentBg.url, '_blank', 'noopener');
                    setBgStatus(opened
                        ? '该图片不允许直接下载，已在新标签页打开 —— 右键「图片另存为」即可保存'
                        : '该图片不允许直接下载，请允许弹出窗口后重试');
                }
            }

            const refreshBgBtn = document.getElementById('refreshBg');
            refreshBgBtn.addEventListener('click', function() { refreshBackground(); });
            const settingsRefreshBtn = document.getElementById('settingsRefreshBg');
            if (settingsRefreshBtn) settingsRefreshBtn.addEventListener('click', function() {
                setBgStatus('');
                refreshBackground();
            });
            const saveBgBtn = document.getElementById('settingsSaveBg');
            if (saveBgBtn) saveBgBtn.addEventListener('click', saveCurrentWallpaper);

            // 页面加载后：主动解析一次壁纸（把随机入口换成真实固定链接）
            (function initBackground() {
                if (!currentBg.url) refreshBackground();
            })();

            /* ===== 侧边栏标签切换（hash 驱动，含浏览器历史） ===== */
            const tabs = document.querySelectorAll('.tab');
            const panels = document.querySelectorAll('.tab-panel');
            // #404 也没有对应按钮；#empty 的侧边栏标签已撤掉（改从主页「关于其他页面」进入），
            // 但路由仍然保留，这里必须让它们都能带着面板留下来，不能退回主页
            const VALID_TAGS = ['#home', '#blog', '#empty', '#history', '#settings', '#404'];
            const NOT_FOUND_TAG = '404';
            // 没有侧边栏按钮、只靠 hash 直达的标签
            const TABLESS_TAGS = { '404': 1, 'empty': 1 };

            // 只负责切换 DOM 与按需加载，绝不写 URL（供 popstate / 初始化复用）
            function renderTab(name) {
                let active = false;
                tabs.forEach(function(t) {
                    const isActive = (t.dataset.tab === name);
                    t.classList.toggle('active', isActive);
                    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    if (isActive) active = true;
                });
                // 未知标签名 → 退回主页；无按钮的合法标签（404 / 空白页面）保持原样
                if (!active && !TABLESS_TAGS[name]) name = 'home';
                panels.forEach(function(p) {
                    const isActive = (p.id === 'tab-' + name);
                    p.classList.toggle('active', isActive);
                });
                // 404 页：切到它的专属背景层并暂停壁纸的"回到前台"干扰
                const isNF = (name === NOT_FOUND_TAG);
                document.body.classList.toggle('nf-mode', isNF);
                if (isNF) {
                    ensureNotFoundBackground();
                    ensureNotFoundCard();
                }
                if (name === 'blog' && window.BlogModule) {
                    window.BlogModule.ensureLoaded();
                }
                if (name === 'history' && window.HistoryModule) window.HistoryModule.ensureLoaded();
                if (name === 'settings') loadThanks();
                return name;
            }

            // mode：'push'（用户点击，新增历史）| 'replace'（初始化/状态修正）
            //       | 'none'（URL 已就位，例如 popstate 与文章级直达，不要动历史）
            function showTab(name, mode) {
                const resolved = renderTab(name);
                if (mode === 'push') pushNav('#' + resolved);
                else if (mode !== 'none') replaceNav('#' + resolved);
                // 标签切换后必须让博客面板的内部状态与新 URL 对齐：
                // 若曾在阅读视图点去别的标签，再切回来时 URL 已是 #blog（列表），
                // 面板不能继续显示上次读的那篇文章（否则视图与 URL 打架、
                // 「返回」也只能退回上一步）。文章级 URL（#blog/post/<id>）
                // 由 blog.js 的 handleHash 流程负责，此处不会干预。
                if (window.BlogModule && window.BlogModule.onTabShown) {
                    window.BlogModule.onTabShown(resolved);
                }
                // 历史版本页同理：切去别的标签时若还停在某份日志里，
                // 回到本页应回到「卡片列表」，别留着上一份日志
                if (window.HistoryModule && window.HistoryModule.onTabShown) {
                    window.HistoryModule.onTabShown(resolved);
                }
                // 标题跟着当前标签走：阅读视图的标题由 openArticle() 自己写，
                // 切到别的标签时若不还原，标签页会一直挂着"LongwaySite-某篇文章"
                if (resolved !== 'blog') document.title = 'LongwaySite';
            }
            // 暴露给 blog.js 用于激活标签（避免重复绑定）；
            // 另外给 blog.js 一个"文章不存在 → 跳 404"的入口
            window.AppShowTab = showTab;
            window.AppShow404 = function() { showTab(NOT_FOUND_TAG, 'replace'); };

            /* ===== 404 页面（独立背景 + 跟随指针倾斜的标题） =====
               背景优先级：同目录 01.txt 里的图床地址 → 失败则退回 01.jpg。
               加载结果（host / local）记在 dataset 上，重复进入不会反复探测。
               文字倾斜见 bindNotFoundTilt()：读的是舞台坐标，鼠标与手指通用。 */
            const NF_TXT = 'lib/images/404page/01.txt';
            const NF_LOCAL = 'lib/images/404page/01.jpg';
            const nfBg = document.getElementById('nfBg');

            // 预加载探针：能加载出来才算"成功"（onerror/超时都算失败）
            function probeImage(url) {
                return new Promise(function(resolve) {
                    if (!url) return resolve(false);
                    const img = new Image();
                    let done = false;
                    const finish = function ok(v) { if (!done) { done = true; resolve(v); } };
                    img.onload = function() { finish(true); };
                    img.onerror = function() { finish(false); };
                    setTimeout(function() { finish(false); }, 8000);   // 兜底：别让坏链接把页面卡住
                    img.src = url;
                });
            }
            function applyNotFoundBg(url) {
                if (nfBg) nfBg.style.backgroundImage = url ? "url('" + String(url).replace(/'/g, '%27') + "')" : '';
            }
            async function ensureNotFoundBackground() {
                if (!nfBg) return;
                // 已经决定过用哪张，就直接复用（不重复探测）
                if (nfBg.dataset.loaded === '1') return;
                let hostUrl = '';
                try {
                    const res = await fetch(NF_TXT, { cache: 'no-store' });
                    if (res.ok) {
                        const text = await res.text();
                        const line = (text.split(/\r?\n/).find(function(l) { return l.trim() !== ''; }) || '').trim();
                        if (/^https?:\/\//i.test(line)) hostUrl = line;
                    }
                } catch (e) { /* 读不到 txt：直接用本地图 */ }

                if (hostUrl && await probeImage(hostUrl)) {
                    nfBg.dataset.loaded = '1';
                    nfBg.dataset.source = 'host';
                    applyNotFoundBg(hostUrl);
                    return;
                }
                nfBg.dataset.loaded = '1';
                nfBg.dataset.source = 'local';
                applyNotFoundBg(NF_LOCAL);
            }

            // 文字朝指针方向倾斜（鼠标 / 手指通用）
            // 注意：跟随的是**整个视口**里的指针位置，不要求指针停在文字上。
            (function bindNotFoundTilt() {
                const textEl = document.getElementById('nfText');
                if (!textEl) return;
                const MAX_Y = 22;   // 左右最大旋转角（幅度大一些，视觉更明显）
                const MAX_X = 12;   // 上下最大旋转角（轻微俯仰，但已经看得出来了）
                function tilt(clientX, clientY) {
                    const w = window.innerWidth || 1;
                    const h = window.innerHeight || 1;
                    // 相对视口中心归一化（-1 ~ 1）：指针在屏幕哪个方位，文字就朝哪里倾
                    const dx = (clientX / w) * 2 - 1;
                    const dy = (clientY / h) * 2 - 1;
                    // 指针在右 → 右缘朝观察者（rotateY 取负）；指针在下 → 底缘朝观察者
                    const ry = -dx * MAX_Y;
                    const rx = dy * MAX_X;
                    textEl.style.transform = 'rotateY(' + ry.toFixed(2) + 'deg) rotateX(' + rx.toFixed(2) + 'deg)';
                }
                function reset() { textEl.style.transform = 'rotateY(0deg) rotateX(0deg)'; }
                // 整个文档上监听：鼠标在页面任何角落（包括文字之外的背景）都会触发
                document.addEventListener('pointermove', function(e) { tilt(e.clientX, e.clientY); }, { passive: true });
                document.addEventListener('pointerdown', function(e) { tilt(e.clientX, e.clientY); }, { passive: true });
                // 指针离开窗口 / 切走标签页时回正，避免停在某个斜角上
                document.addEventListener('pointerleave', reset);
                window.addEventListener('blur', reset);
            })();

            /* 404 说明卡片：内容在 lib/documents/errorsite/404site/content.md，
               用**正文同一个** Markdown 渲染器（window.LongwayMarkdown）渲染，
               只是关掉原始 HTML（html:false → 标签按文字显示），所以卡片里写
               `##`、列表、表格都能正常排，写 `<b>` 只会看到字面量。
               文本只取一次；markdown.js 要等外部脚本加载完才可用，所以这次没渲染成功就
               保持隐藏、下次进入 404 再试（避免先把半成品显示出来）。 */
            const NF_CARD_TXT = 'lib/documents/errorsite/404site/content.md';
            const NF_CARD_MD_OPTIONS = { html: false, sanitize: true };
            const nfCard = document.getElementById('nfCard');
            let nfCardText = null;      // 取到的原文（null = 还没取过）
            let nfCardDone = false;     // 是否已经渲染并显示
            let nfCardTries = 0;        // 等渲染器就绪的重试次数

            async function ensureNotFoundCard() {
                if (!nfCard || nfCardDone) return;
                if (nfCardText === null) {
                    try {
                        const res = await fetch(NF_CARD_TXT, { cache: 'no-store' });
                        nfCardText = res.ok ? await res.text() : '';
                    } catch (e) { nfCardText = ''; }
                }
                const body = (nfCardText || '').trim();
                if (!body) return;      // 文件缺失/为空：这张卡片就不出现
                const md = window.LongwayMarkdown && window.LongwayMarkdown.render;
                if (typeof md === 'function') {
                    nfCard.innerHTML = md(body, NF_CARD_MD_OPTIONS);
                    nfCardDone = true;
                    nfCard.hidden = false;
                    return;
                }
                // 渲染器还没就绪（markdown.js 尚未执行完，直接访问 #404 时会遇到）：
                // 先不显示，隔一会儿再试 —— 别把 Markdown 原文（## / ** 之类）露出来
                if (nfCardTries < 20) {
                    nfCardTries++;
                    setTimeout(ensureNotFoundCard, 100);
                    return;
                }
                // 等太久仍然没有渲染器（脚本加载失败？）：退化为纯文本，
                // 顺手去掉行首的 # 标记，至少读得懂
                nfCard.textContent = body.replace(/^[ \t]{0,3}#{1,6}[ \t]+/gm, '');
                nfCardDone = true;
                nfCard.hidden = false;
            }

            // 「回到主页」按钮
            (function bindNotFoundHome() {
                const btn = document.getElementById('nfHomeBtn');
                if (btn) btn.addEventListener('click', function() { showTab('home', 'push'); });
            })();

            // 首页「关于其他页面」卡片里的入口（<a href="#404">：中键/Ctrl 点也能开新标签）
            (function bindHomeNotFoundLink() {
                const link = document.getElementById('homeLink404');
                if (link) link.addEventListener('click', function(e) {
                    e.preventDefault();
                    showTab(NOT_FOUND_TAG, 'push');
                });
            })();

            tabs.forEach(function(t) {
                t.addEventListener('click', function() {
                    showTab(t.dataset.tab, 'push');
                });
            });

            // hash → 标签名。'' 与 '#'（用户把地址栏里的 #… 删掉）按首页处理；
            // 不认识的 hash 返回 null，由调用方决定落 404
            function hashToTab(h) {
                if (!h || h === '#') return 'home';
                return VALID_TAGS.indexOf(h) !== -1 ? h.slice(1) : null;
            }
            // 当前画面是否已经停在这个标签上（404 没有侧边栏按钮，所以按面板判断）
            function isTabActive(name) {
                const panel = document.getElementById('tab-' + name);
                return !!panel && panel.classList.contains('active');
            }

            // 浏览器前进 / 后退：按当前位置的 hash 重建视图
            window.addEventListener('popstate', function(e) {
                if (e.state && typeof e.state.navIdx === 'number') navIdx = e.state.navIdx;
                const h = currentHash();
                // 文章级 hash 交给 blog.js 处理：它需要"先开文章再激活博客标签"，
                // 否则主脚本的 ensureLoaded 会抢跑，错过缓存命中
                if (/^#blog\/post\//.test(h)) return;
                const tab = hashToTab(h);
                // 不认识的 hash → 404 页（用 replace 落定 hash，别在历史里再塞一条）
                showTab(tab !== null ? tab : NOT_FOUND_TAG, tab !== null ? 'none' : 'replace');
            });

            // 手动改地址栏 hash 时**只**触发 hashchange（不触发 popstate），
            // 所以这里必须自己把合法标签也切过去——否则地址栏成了 #history，
            // 画面却还停在上一个标签。
            // 文章级 hash 仍交给 blog.js 的 handleHash，避免两处抢活。
            window.addEventListener('hashchange', function() {
                const h = currentHash();
                if (/^#blog\/post\//.test(h)) return;
                const tab = hashToTab(h);
                if (tab === null) {                 // 陌生 hash → 404（replace 落定，不新增历史）
                    if (!isTabActive(NOT_FOUND_TAG)) showTab(NOT_FOUND_TAG, 'replace');
                    return;
                }
                if (isTabActive(tab)) return;       // 已经在这个标签上：别重复渲染
                showTab(tab, 'none');               // URL 已就位，只切视图、不写历史
            });

            // 初始：解析 hash（含文章级直达 #blog/post/<id>）或默认主页
            let initialTag = 'home';
            let initialMode = 'replace';
            const h = currentHash();
            const isPostHash = /^#blog\/post\//.test(h);
            if (isPostHash) {
                initialTag = 'blog'; // 文章级直达：先激活博客面板，文章打开由 blog.js 处理
                initialMode = 'none'; // hash 必须原样保留，不能被改写成 #blog
            } else if (VALID_TAGS.indexOf(h) !== -1) {
                initialTag = h.slice(1);
            } else if (h && h !== '#' && h !== '#home') {
                initialTag = NOT_FOUND_TAG; // 陌生 hash → 404
            }
            // 首屏不产生可回退项
            showTab(initialTag, initialMode);

            /* ===== 通用文本列表（先缓存、再静默更新） ===== */
            // 历史版本页已改为 lib/js/history.js + history.css 独立实现，
            // 这里只剩致谢名单在用（renderLinesTo / readListCache / writeListCache）。
            function renderLinesTo(container, lines, emptyText) {
                if (!container) return;
                if (!lines || lines.length === 0) {
                    container.innerHTML = '<div class="error">' + (emptyText || '暂无记录') + '</div>';
                    return;
                }
                let ul = document.createElement('ul');
                ul.className = 'version-list';
                lines.forEach(function(line) {
                    let li = document.createElement('li');
                    li.textContent = line.trim();
                    ul.appendChild(li);
                });
                container.innerHTML = '';
                container.appendChild(ul);
            }
            function readListCache(key) {
                try {
                    const raw = localStorage.getItem(key);
                    if (!raw) return null;
                    const d = JSON.parse(raw);
                    return (Array.isArray(d) && d.length) ? d : null;
                } catch (e) { return null; }
            }
            function writeListCache(key, lines) {
                try { localStorage.setItem(key, JSON.stringify(lines)); } catch (e) { /* ignore */ }
            }

            /* ===== 致谢名单懒加载（缓存 + 静默更新） ===== */
            async function loadThanks() {
                if (thanksLoaded) return;
                thanksLoaded = true;
                const container = document.getElementById('thanksContent');
                const url = 'lib/documents/archive/thanks/致谢名单.txt';
                const cacheKey = 'LongwaySiteThanks';

                // 1) 缓存先展示
                const cached = readListCache(cacheKey);
                if (cached) {
                    renderLinesTo(container, cached, '暂无致谢名单', '加载失败');
                } else if (container) {
                    container.innerHTML = '<div class="loading">加载中...</div>';
                }
                // 2) 网络拉取更新
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const text = await response.text();
                    const lines = text.split('\n').filter(function(line) { return line.trim() !== ''; });
                    writeListCache(cacheKey, lines);
                    renderLinesTo(container, lines, '暂无致谢名单', '加载失败');
                } catch (error) {
                    if (!readListCache(cacheKey) && container) {
                        container.innerHTML = '<div class="error">加载失败: ' + error.message + '</div>';
                    }
                }
            }

            /* ===== 博客标题左下角实时时钟 ===== */
            const blogTimeEl = document.getElementById('blogTime');
            if (blogTimeEl) {
                // pad2 用外层那个（本文件顶部已定义），这里不再重复声明
                function updateBlogTime() {
                    const now = new Date();
                    blogTimeEl.textContent =
                        now.getFullYear() + '年' +
                        (now.getMonth() + 1) + '月' +
                        now.getDate() + '日 ' +
                        pad2(now.getHours()) + ':' +
                        pad2(now.getMinutes()) + ':' +
                        pad2(now.getSeconds());
                }
                updateBlogTime();
                setInterval(updateBlogTime, 1000);
            }
        })();
    </script>
    <!-- Markdown 渲染器与语法高亮：必须先于 blog.js 加载（blog.js 只做委托） -->
    <script src="lib/js/markdown.js"></script>
    <script src="lib/js/highlight.js"></script>
    <script src="lib/js/blog.js"></script>
    <!-- 历史版本页：Release / Beta 卡片 + 版本日志阅读视图（复用 markdown.js / highlight.js） -->
    <script src="lib/js/history.js"></script>
    <!-- 卡片内 HTML 片段的安全渲染器：自带 autoMount，没有 data-lg-html 元素时什么都不做 -->
    <script src="lib/js/html.js"></script>
</body>
</html>
