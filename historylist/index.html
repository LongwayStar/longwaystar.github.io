<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LongwayStar的历史版本列表" />
    <meta name="author" content="LongwayStar" />
    <link rel="icon" href="../lib/icons/title.png" />
    <title>LongWeb-Historylist</title>
    <style>
        :root {
            --bg-body: #f0f8fc;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-primary: #1a2a3a;
            --text-secondary: #2c3e50;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --border-color: rgba(6, 182, 212, 0.2);
            --cyan-500: #06B6D4;
            --cyan-300: #67E8F9;
            --cyan-200: #A5F3FC;
            --cyan-100: #CFFAFE;
            --cyan-50: #ECFEFF;
            --btn-bg: #06B6D4;
            --btn-text: #fff;
            --footer-color: #4a5a6a;
        }
        [data-theme="dark"] {
            --bg-body: #121e2a;
            --bg-card: rgba(30, 44, 58, 0.92);
            --text-primary: #e8f0f8;
            --text-secondary: #c0d0e0;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            --border-color: rgba(103, 232, 249, 0.25);
            --btn-bg: #67E8F9;
            --btn-text: #0a1a22;
            --footer-color: #8aa0b0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.5rem 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }
        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .header {
            text-align: center;
            padding: 0.5rem 0 0.2rem;
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, var(--cyan-500), var(--cyan-300));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }
        .header hr {
            width: 80%;
            max-width: 300px;
            margin: 0.5rem auto 0;
            border: none;
            height: 3px;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--cyan-200), var(--cyan-500), var(--cyan-200));
            opacity: 0.6;
        }
        .theme-toggle {
            position: fixed;
            top: 1.2rem;
            right: 1.5rem;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
            transition: all 0.25s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(4px);
            background-color: var(--btn-bg);
            color: var(--btn-text);
        }
        .theme-toggle:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 18px rgba(6, 182, 212, 0.4);
        }
        .theme-toggle .icon {
            font-size: 1.2rem;
            line-height: 1;
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(2px);
            border-radius: var(--radius);
            padding: 1.8rem 2rem 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card h2 {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
            position: relative;
            display: inline-block;
            align-self: center;
        }
        .card h2::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--cyan-300), var(--cyan-500));
            opacity: 0.5;
        }
        .card .version-list {
            display: inline-block;
            text-align: left;
            margin: 0.5rem auto 0;
            padding-left: 0;
            list-style: none;
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 2;
            width: 100%;
            max-width: 400px;
        }
        .card .version-list li::before {
            content: "• ";
            color: var(--cyan-500);
            font-weight: bold;
        }
        .card .link-btn {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.5rem 1.8rem;
            background: var(--cyan-500);
            color: #fff;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
            border: 1px solid transparent;
        }
        .card .link-btn:hover {
            background: var(--cyan-300);
            color: #0a1a22;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.35);
        }
        .footer {
            margin-top: 2rem;
            padding: 1rem 0 0.5rem;
            width: 100%;
            max-width: 720px;
            border-top: 1px solid var(--border-color);
            transition: color 0.3s ease, border-color 0.3s ease;
        }
        .footer-content {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .footer-content p {
            margin: 0;
            color: var(--footer-color);
            font-size: 0.85rem;
            line-height: 1.8;
            white-space: nowrap;
        }
        .loading {
            color: var(--text-secondary);
            font-size: 1rem;
            margin: 1rem 0;
        }
        .error {
            color: #e74c3c;
            font-size: 0.95rem;
            margin: 1rem 0;
        }
        @media (max-width: 500px) {
            .footer-content {
                gap: 0.8rem;
            }
            .footer-content p {
                font-size: 0.75rem;
            }
        }
        @media (max-width: 600px) {
            body {
                padding: 1.2rem 0.8rem 0.8rem;
            }
            .container {
                gap: 1.5rem;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .card {
                padding: 1.4rem 1.2rem 1.6rem;
            }
            .card h2 {
                font-size: 1.3rem;
            }
            .theme-toggle {
                top: 0.8rem;
                right: 0.8rem;
                padding: 0.3rem 1rem;
                font-size: 0.8rem;
                border-radius: 30px;
            }
            .theme-toggle .icon {
                font-size: 1rem;
            }
        }
        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换暗色/亮色模式">
        <span class="icon" id="themeIcon">🌙</span>
        <span id="themeLabel">暗色</span>
    </button>
    <div class="container">
        <header class="header">
            <h1>历史版本列表</h1>
            <hr />
        </header>
        <section class="card" id="betaCard">
            <h2>Beta 版本</h2>
            <div id="betaContent"><div class="loading">加载中...</div></div>
        </section>
        <section class="card" id="releaseCard">
            <h2>RELEASE 版本</h2>
            <div id="releaseContent"><div class="loading">加载中...</div></div>
        </section>
        <section class="card">
            <h2>关于新主页</h2>
            <p>
                <a class="link-btn" href="../index.html">返回主页</a>
            </p>
        </section>
    </div>
    <footer class="footer">
        <div class="footer-content">
            <p>Powered by GithubPages</p>
            <p>Coded by Deepseek</p>
            <p>Created by LongwayStar</p>
        </div>
    </footer>
    <script>
        (function() {
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            const html = document.documentElement;
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme) {
                html.setAttribute('data-theme', storedTheme);
                updateButton(storedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
                updateButton('dark');
            } else {
                html.setAttribute('data-theme', 'light');
                updateButton('light');
            }
            function updateButton(theme) {
                if (theme === 'dark') {
                    icon.textContent = '☀️';
                    label.textContent = '亮色';
                } else {
                    icon.textContent = '🌙';
                    label.textContent = '暗色';
                }
            }
            toggleBtn.addEventListener('click', function() {
                const current = html.getAttribute('data-theme');
                const next = (current === 'dark') ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateButton(next);
            });
            const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMedia.addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    const newTheme = e.matches ? 'dark' : 'light';
                    html.setAttribute('data-theme', newTheme);
                    updateButton(newTheme);
                }
            });

            async function loadVersionList(fileName, containerId) {
                const container = document.getElementById(containerId);
                // 本地相对路径（相对于当前 historylist/index.html）
                const baseUrl = '../lib/words/historylist/';
                const encodedFile = encodeURIComponent(fileName);
                const url = baseUrl + encodedFile;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    if (lines.length === 0) {
                        container.innerHTML = '<div class="error">暂无版本记录</div>';
                        return;
                    }
                    let ul = document.createElement('ul');
                    ul.className = 'version-list';
                    lines.forEach(line => {
                        let li = document.createElement('li');
                        li.textContent = line.trim();
                        ul.appendChild(li);
                    });
                    container.innerHTML = '';
                    container.appendChild(ul);
                } catch (error) {
                    container.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
                }
            }

            loadVersionList('BETA版本.txt', 'betaContent');
            loadVersionList('RELEASE版本.txt', 'releaseContent');
        })();
    </script>
</body>
</html>
