<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LongwayStar的历史版本列表" />
    <meta name="author" content="LongwayStar" />
    <link rel="icon" href="../lib/icons/new_title.ico" />
    <link rel="stylesheet" href="../lib/css/generalstyle.css" />
    <title>LongWeb-Historylist</title>
    <style>
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card h2 {
            margin-bottom: 1rem;
            align-self: center;
        }
        .card .version-list {
            display: inline-block;
            text-align: left;
            margin: 0.5rem auto 0;
            padding-left: 0;
            list-style: none;
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 2;
            width: 100%;
            max-width: 400px;
        }
        .card .version-list li::before {
            content: "• ";
            color: var(--cyan-500);
            font-weight: bold;
        }
        .card .link-btn {
            margin-top: 0.5rem;
        }
        .loading {
            color: var(--text-secondary);
            font-size: 1rem;
            margin: 1rem 0;
        }
        .error {
            color: #e74c3c;
            font-size: 0.95rem;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换暗色/亮色模式">
        <span class="icon" id="themeIcon">🌙</span>
        <span id="themeLabel">暗色</span>
    </button>
    <div class="container">
        <header class="header">
            <h1>历史版本列表</h1>
            <hr />
        </header>
        <section class="card" id="betaCard">
            <h2>Beta 版本</h2>
            <div id="betaContent"><div class="loading">加载中...</div></div>
        </section>
        <section class="card" id="releaseCard">
            <h2>RELEASE 版本</h2>
            <div id="releaseContent"><div class="loading">加载中...</div></div>
        </section>
        <section class="card">
            <h2>关于新主页</h2>
            <p>
                <a class="link-btn" href="../index.html">返回主页</a>
            </p>
        </section>
    </div>
    <footer class="footer">
        <div class="footer-content">
            <p>Powered by GithubPages</p>
            <p>Coded by Deepseek</p>
            <p>Created by LongwayStar</p>
        </div>
    </footer>
    <script>
        (function() {
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            const html = document.documentElement;
            const storedTheme = localStorage.getItem('theme');
            if (storedTheme) {
                html.setAttribute('data-theme', storedTheme);
                updateButton(storedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
                updateButton('dark');
            } else {
                html.setAttribute('data-theme', 'light');
                updateButton('light');
            }
            function updateButton(theme) {
                if (theme === 'dark') {
                    icon.textContent = '☀️';
                    label.textContent = '亮色';
                } else {
                    icon.textContent = '🌙';
                    label.textContent = '暗色';
                }
            }
            toggleBtn.addEventListener('click', function() {
                const current = html.getAttribute('data-theme');
                const next = (current === 'dark') ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateButton(next);
            });
            const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            darkModeMedia.addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    const newTheme = e.matches ? 'dark' : 'light';
                    html.setAttribute('data-theme', newTheme);
                    updateButton(newTheme);
                }
            });

            async function loadVersionList(fileName, containerId) {
                const container = document.getElementById(containerId);
                // 本地相对路径（相对于当前 historylist/index.html）
                const baseUrl = '../lib/words/historylist/';
                const encodedFile = encodeURIComponent(fileName);
                const url = baseUrl + encodedFile;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    if (lines.length === 0) {
                        container.innerHTML = '<div class="error">暂无版本记录</div>';
                        return;
                    }
                    let ul = document.createElement('ul');
                    ul.className = 'version-list';
                    lines.forEach(line => {
                        let li = document.createElement('li');
                        li.textContent = line.trim();
                        ul.appendChild(li);
                    });
                    container.innerHTML = '';
                    container.appendChild(ul);
                } catch (error) {
                    container.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
                }
            }

            loadVersionList('BETA版本.txt', 'betaContent');
            loadVersionList('RELEASE版本.txt', 'releaseContent');
        })();
    </script>
</body>
</html>
